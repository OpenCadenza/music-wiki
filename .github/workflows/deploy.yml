name: Build and deploy Music Wiki

on:
  push:
    branches:
      - main
      - dsh-c6ded6ed-82bb
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dev_ref:
        description: '开发预览分支：其 content/ 会发布到 /music-wiki/dev/<分支>/'
        required: false
        default: dsh-c6ded6ed-82bb
        type: string

permissions:
  contents: read

env:
  DEV_BRANCH: ${{ github.event.inputs.dev_ref || 'dsh-c6ded6ed-82bb' }}
  PROD_BASE: /music-wiki/

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-main:
    name: Build main site
    uses: ./.github/workflows/build-site.yml
    with:
      # Pull requests validate the pulled commit; pushes and manual runs build main.
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      base: /music-wiki/
      artifact: site-main

  # The development preview is published next to the main site. It is built by
  # the same workflow from main's configuration, with only the branch's
  # content/ swapped in, so the preview cannot drift from the public pipeline.
  build-dev:
    name: Build dev preview
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-site.yml
    with:
      ref: main
      content_ref: ${{ github.event.inputs.dev_ref || 'dsh-c6ded6ed-82bb' }}
      base: /music-wiki/dev/${{ github.event.inputs.dev_ref || 'dsh-c6ded6ed-82bb' }}/
      artifact: site-dev

  deploy:
    name: Publish GitHub Pages
    # A broken development branch must never block the public site.
    if: always() && github.event_name != 'pull_request' && needs.build-main.result == 'success'
    needs: [build-main, build-dev]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download main site
        uses: actions/download-artifact@v4
        with:
          name: site-main
          path: dist

      - name: Download dev preview
        id: dev-site
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-dev
          path: dev-site

      - name: Publish dev preview under /dev/<branch>/
        if: steps.dev-site.outcome == 'success'
        run: |
          set -euo pipefail
          target="dist/dev/${DEV_BRANCH}"
          mkdir -p "$target"
          cp -a dev-site/. "$target/"
          test -f "$target/index.html"
          echo "dev preview: ${PROD_BASE}dev/${DEV_BRANCH}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Report missing dev preview
        if: steps.dev-site.outcome != 'success'
        run: |
          echo "::warning::site-dev artifact is missing; publishing the main site without a dev preview"
          echo "dev preview skipped: no site-dev artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
