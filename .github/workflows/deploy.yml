name: Build and deploy Music Wiki

on:
  push:
    # Every branch that should redeploy on push. Development preview branches
    # must also be listed in branches.json and allowed to deploy to the
    # github-pages environment (see README).
    branches:
      - main
      - dsh-c6ded6ed-82bb
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_BASE: /music-wiki/

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # branches.json is the single source of truth for which branches get a site.
  config:
    name: Read branches.json
    runs-on: ubuntu-24.04
    outputs:
      dev: ${{ steps.read.outputs.dev }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The branch list is owned by main, whatever ref triggered the run.
          ref: main
      - name: Collect development branches
        id: read
        run: echo "dev=$(node scripts/branch-sites.mjs)" >> "$GITHUB_OUTPUT"

  build-main:
    name: Build main site
    uses: ./.github/workflows/build-site.yml
    with:
      # Pull requests validate the pulled commit; pushes and manual runs build main.
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      base: /music-wiki/
      artifact: site-main

  # One job per development branch: main's pipeline, that branch's content/.
  build-branches:
    name: Build ${{ matrix.branch.label }}
    needs: config
    if: github.event_name != 'pull_request' && needs.config.outputs.dev != '[]'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.config.outputs.dev) }}
    uses: ./.github/workflows/build-site.yml
    with:
      ref: main
      content_ref: ${{ matrix.branch.branch }}
      base: /music-wiki/dev/${{ matrix.branch.slug }}/
      artifact: site-dev-${{ matrix.branch.slug }}

  deploy:
    name: Publish GitHub Pages
    # A broken development branch must never block the public site.
    if: always() && github.event_name != 'pull_request' && needs.build-main.result == 'success'
    needs: [config, build-main, build-branches]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download main site
        uses: actions/download-artifact@v4
        with:
          name: site-main
          path: dist

      - name: Download development sites
        id: dev-sites
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: site-dev-*
          path: dev-artifacts

      - name: Publish development previews under /dev/<slug>/
        if: steps.dev-sites.outcome == 'success'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in dev-artifacts/site-dev-*; do
            [ -d "$dir" ] || continue
            slug="${dir##*site-dev-}"
            target="dist/dev/${slug}"
            mkdir -p "$target"
            cp -a "$dir"/. "$target"/
            test -f "$target/index.html"
            echo "dev preview: ${PROD_BASE}dev/${slug}/" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Report missing development previews
        if: steps.dev-sites.outcome != 'success'
        run: |
          echo "::warning::no site-dev-* artifacts were produced; publishing the main site only"
          echo "dev previews skipped" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
